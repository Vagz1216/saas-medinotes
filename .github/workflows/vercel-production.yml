name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_QQR5ALYns9jcrPFLHj2G4orp
      VERCEL_PROJECT_ID: prj_ELxUf5k1GV8sH4lS66Sk5OyCFhWe
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 54.4.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Check Vercel CI configuration
        run: |
          missing=0

          for name in VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Vercel configuration::$name is required for production deployment."
              missing=1
            fi
          done

          exit "$missing"

      - name: Verify Vercel token
        run: vercel whoami --token="$VERCEL_TOKEN" >/dev/null

      - name: Create Vercel project link
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel project
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
